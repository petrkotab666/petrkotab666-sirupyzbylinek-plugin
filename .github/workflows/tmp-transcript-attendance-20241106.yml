name: tmp-transcript-attendance-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcribe full HLS audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
          HLS='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/4596793a-66a9-4cf5-b40e-0bb973996508-master.m3u8'
          ffmpeg -hide_banner -loglevel error -i "$HLS" -vn -ac 1 -ar 16000 -af 'volume=3' -y out/full.wav
          python3 -m pip install --quiet faster-whisper
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          names='Tomáš Oršulák, Stanislav Hakl, Petr Hossner, Alena Benešová, Jiří Kulhánek, Jan Losenický, Radek Oswald, Jiří Jerie, Adam Studený, Josef Steiner, Jan Vaic, Michal Voltr, Aleš Padrta, Zdeněk Hosman, Martina Matoušková Faldusová, Pavel Neprášek, Stanislava Pardubská, Miloš Wendl, Pavel Zárybnický, Jana Demjanová, Jan Lazarčík, Miroslav Novotný, Miloslav Straka, Jiří Švec, Jindra Zalabáková, Radek Jára, Jan Zach.'
          prompt='Mimořádné zasedání zastupitelstva města Kadaň dne 6. listopadu 2024. Přítomno 26 z 27 zastupitelů. Jeden zastupitel je nepřítomen nebo omluven. Jména: '+names
          model=WhisperModel('medium',device='cpu',compute_type='int8')
          segs,info=model.transcribe('out/full.wav',language='cs',beam_size=5,vad_filter=True,initial_prompt=prompt,condition_on_previous_text=True)
          with open('out/full_transcript.txt','w',encoding='utf-8') as f:
            for s in segs:
              line=f'[{s.start:07.1f}-{s.end:07.1f}] {s.text.strip()}'
              print(line); f.write(line+'\n')
          PY
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: full-transcript-attendance-20241106
          path: out/full_transcript.txt
          retention-days: 1
