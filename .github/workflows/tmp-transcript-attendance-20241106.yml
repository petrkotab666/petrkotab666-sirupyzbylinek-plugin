name: tmp-transcript-attendance-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract HLS audio and transcribe first 5 minutes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
          HLS='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/4596793a-66a9-4cf5-b40e-0bb973996508-master.m3u8'
          curl -L --fail --retry 3 "$HLS" -o out/master.m3u8
          cat out/master.m3u8
          ffmpeg -hide_banner -loglevel warning -ss 0 -t 300 -i "$HLS" -vn -ac 1 -ar 16000 -y out/intro.wav
          ffmpeg -hide_banner -i out/intro.wav -af volumedetect -f null - 2> out/volume.txt || true
          cat out/volume.txt
          python3 -m pip install --quiet faster-whisper
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel('small', device='cpu', compute_type='int8')
          segs,info=model.transcribe('out/intro.wav', language='cs', beam_size=5, vad_filter=False)
          with open('out/transcript.txt','w',encoding='utf-8') as f:
            for s in segs:
              line=f'[{s.start:06.1f}-{s.end:06.1f}] {s.text.strip()}'
              print(line)
              f.write(line+'\n')
          PY
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-attendance-20241106-hls
          path: |
            out/transcript.txt
            out/master.m3u8
            out/volume.txt
          retention-days: 1
