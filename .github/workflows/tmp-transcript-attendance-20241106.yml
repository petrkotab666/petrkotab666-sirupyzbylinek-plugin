name: tmp-transcript-attendance-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download video and transcribe first 4 minutes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
          URL='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/8eb2d167-1697-4d2e-878c-2858c5234d0b-480-fragmented.mp4'
          curl -L --fail --retry 3 "$URL" -o out/video.mp4
          ffmpeg -hide_banner -loglevel error -ss 0 -t 240 -i out/video.mp4 -vn -ac 1 -ar 16000 out/intro.wav
          python3 -m pip install --quiet faster-whisper
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel('small', device='cpu', compute_type='int8')
          segs,info=model.transcribe('out/intro.wav', language='cs', beam_size=5, vad_filter=True)
          with open('out/transcript.txt','w',encoding='utf-8') as f:
            for s in segs:
              line=f'[{s.start:06.1f}-{s.end:06.1f}] {s.text.strip()}'
              print(line)
              f.write(line+'\n')
          PY
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-attendance-20241106
          path: out/transcript.txt
          retention-days: 1
