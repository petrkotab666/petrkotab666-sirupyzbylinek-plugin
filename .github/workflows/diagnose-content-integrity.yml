name: Diagnose content integrity
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/diagnose-content-integrity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Prepare generated assets and content
        working-directory: site
        run: npm run prebuild
      - name: Build Astro site
        working-directory: site
        run: npx astro build
      - name: Prepare built output for integrity audit
        working-directory: site
        run: |
          node scripts/generate-legacy-redirects.mjs
          node scripts/deduplicate-built-article-images.mjs
          node scripts/patch-site-audit.mjs
      - name: Run content integrity audit and preserve report
        working-directory: site
        shell: bash
        run: |
          set +e
          node scripts/audit-content-integrity.mjs > /tmp/content-integrity.log 2>&1
          status=$?
          cat /tmp/content-integrity.log
          printf '%s\n' "$status" > /tmp/content-integrity-exit-code.txt
          exit 0
      - name: Persist diagnostics in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sirupyzbylinek-diagnostic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p .diagnostics
          cp /tmp/content-integrity.log .diagnostics/content-integrity.log
          cp /tmp/content-integrity-exit-code.txt .diagnostics/content-integrity-exit-code.txt
          git add .diagnostics/content-integrity.log .diagnostics/content-integrity-exit-code.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Uložit diagnostiku obsahového auditu [skip ci]'
            git push origin HEAD:main
          fi
      - name: Fail when integrity audit failed
        shell: bash
        run: |
          status="$(cat /tmp/content-integrity-exit-code.txt)"
          if [ "$status" != "0" ]; then
            echo "Content integrity audit failed; diagnostics were persisted in the repository."
            exit "$status"
          fi
