name: Diagnostika časové osy kláštera na živém webu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-klaster-image-live-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vypsat živý stav bridge a CSS časové osy
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://nasekadan.cz/bridge-health.txt?check=$stamp" -o /tmp/health || true
          curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://nasekadan.cz/clanky/kadansky-klaster-ctyri-umrti-listopad-1981.html?check=$stamp" -o /tmp/article || true
          echo '--- HEALTH ---'
          cat /tmp/health || true
          echo '--- TIMELINE CSS ---'
          grep -oE '.{0,120}timeline.{0,600}' /tmp/article | head -n 8 || true
          echo '--- EVENT CSS ---'
          grep -oE '.{0,120}\.event[^}]*\}' /tmp/article | head -n 20 || true
          echo '--- ARTICLE SIZE ---'
          wc -c /tmp/article || true
