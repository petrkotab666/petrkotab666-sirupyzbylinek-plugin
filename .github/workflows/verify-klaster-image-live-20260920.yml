name: Ověřit opravu obrázku kláštera na živém webu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-klaster-image-live-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ověřit bridge a odstranit rozbitou duplicitní figuru
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='20260920-0738-klaster-duplicate-broken-figure'
          article='https://nasekadan.cz/clanky/kadansky-klaster-ctyri-umrti-listopad-1981.html'
          broken='/social/kadansky-klaster-ctyri-umrti-listopad-1981.png'
          for n in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-$n-$(date +%s)"
            health="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://nasekadan.cz/bridge-health.txt?check=$stamp" || true)"
            body="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$article?check=$stamp" || true)"
            count="$(grep -o 'article-figure' <<<"$body" | wc -l | tr -d ' ')"
            if grep -Fq "version=$expected" <<<"$health" \
              && grep -Fq 'Čtyři úmrtí během jediného listopadu' <<<"$body" \
              && ! grep -Fq "src=\"$broken\"" <<<"$body" \
              && [[ "$count" -ge 1 ]]; then
              echo "NASEKADAN_KLASTER_IMAGE_REPAIR_WEB_OK figures=$count"
              exit 0
            fi
            sleep 5
          done
          echo 'NASEKADAN_KLASTER_IMAGE_REPAIR_WEB_NOT_OK' >&2
          exit 1
