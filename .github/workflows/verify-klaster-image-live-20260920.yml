name: Ověřit opravu časové osy kláštera na živém webu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-klaster-image-live-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ověřit bridge a opravenou časovou osu
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='20260920-2046-klaster-timeline-layout-fix'
          article='https://nasekadan.cz/clanky/kadansky-klaster-ctyri-umrti-listopad-1981.html'
          for n in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-$n-$(date +%s)"
            health="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://nasekadan.cz/bridge-health.txt?check=$stamp" || true)"
            body="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$article?check=$stamp" || true)"
            if grep -Fq "version=$expected" <<<"$health" \
              && grep -Fq 'Čtyři úmrtí během jediného listopadu' <<<"$body" \
              && grep -Fq '.timeline>.event{display:block!important;grid-template-columns:none!important' <<<"$body" \
              && grep -Fq '.timeline>.event>*{grid-column:auto!important' <<<"$body"; then
              echo 'NASEKADAN_KLASTER_TIMELINE_REPAIR_WEB_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'NASEKADAN_KLASTER_TIMELINE_REPAIR_WEB_NOT_OK' >&2
          exit 1
