name: Deploy SirupyZBylinek to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sirupyzbylinek-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and verify
    if: github.event_name != 'pull_request' || github.head_ref == 'force-cloudflare-production-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and audit site
        working-directory: site
        run: npm run build

      - name: Force production branch to main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"

          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.production_branch == "main"' >/dev/null
          echo "Cloudflare production branch is main."

      - name: Deploy production with current Wrangler
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="${CLOUDFLARE_PROJECT_NAME}" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Controlled production deployment" \
            --commit-dirty=true | tee /tmp/wrangler-output.txt

          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9]+\.sirupyzbylinek-astro\.pages\.dev' /tmp/wrangler-output.txt | tail -n 1)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment URL: $DEPLOYMENT_URL"

      - name: Confirm deployment is active production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"

          printf '%s' "$RESPONSE" | jq -r '"Canonical deployment: \(.result.canonical_deployment.id)\nEnvironment: \(.result.canonical_deployment.environment)\nURL: \(.result.canonical_deployment.url)\nBranch: \(.result.canonical_deployment.deployment_trigger.metadata.branch)\nStatus: \(.result.canonical_deployment.latest_stage.status)"'
          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.canonical_deployment.environment == "production" and .result.canonical_deployment.deployment_trigger.metadata.branch == "main" and .result.canonical_deployment.latest_stage.status == "success"' >/dev/null

      - name: Verify uploaded deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "${DEPLOYMENT_URL}/deploy-version.txt" -o /tmp/deploy-version.txt
          curl -fsS --max-time 20 "${DEPLOYMENT_URL}/nejcastejsi-chyby-pri-pestovani-bylinek/" -o /tmp/article.html
          curl -fsS --max-time 20 --output /dev/null "${DEPLOYMENT_URL}/obrazky/pestovani.svg"
          python3 - /tmp/deploy-version.txt /tmp/article.html <<'PY'
          from html import unescape
          from pathlib import Path
          import re
          import sys

          version = Path(sys.argv[1]).read_text(encoding='utf-8')
          markup = Path(sys.argv[2]).read_text(encoding='utf-8')

          def plain(value: str) -> str:
              return ' '.join(unescape(re.sub(r'<[^>]+>', ' ', value)).split())

          kicker_match = re.search(r'class="article-kicker"[^>]*>([\s\S]*?)</div>', markup, re.I)
          hero_match = re.search(r'<img\b[^>]*class=["\'][^"\']*hero-image[^"\']*["\'][^>]*>', markup, re.I)
          hero_src_match = re.search(r'\bsrc=["\']([^"\']+)["\']', hero_match.group(0), re.I) if hero_match else None
          kicker = plain(kicker_match.group(1)) if kicker_match else ''
          hero_src = hero_src_match.group(1) if hero_src_match else ''
          visible = plain(markup)
          banned = [
              'Rychlé shrnutí článku',
              'hlavní klíčové slovo',
              'SEO 90+',
              'produktový XML feed',
              'affiliate doporučení',
          ]

          errors = []
          if 'expected-cultivation-category: Pěstování bylinek' not in version:
              errors.append('deployment marker is missing')
          if kicker != 'Pěstování bylinek':
              errors.append(f'wrong article kicker: {kicker!r}')
          if '/obrazky/pestovani.svg' not in hero_src:
              errors.append(f'wrong hero image: {hero_src!r}')
          for phrase in banned:
              if phrase.casefold() in visible.casefold():
                  errors.append(f'banned visible phrase: {phrase}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Uploaded deployment verified: kicker={kicker!r}, hero={hero_src!r}.')
          PY

      - name: Verify public production alias
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            CACHE_BUSTER="$(date +%s)-${attempt}"
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sirupyzbylinek-astro.pages.dev/deploy-version.txt?v=${CACHE_BUSTER}" -o /tmp/public-version.txt \
              && curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sirupyzbylinek-astro.pages.dev/nejcastejsi-chyby-pri-pestovani-bylinek/?v=${CACHE_BUSTER}" -o /tmp/public-article.html \
              && curl -fsS --max-time 20 --output /dev/null "https://sirupyzbylinek-astro.pages.dev/obrazky/pestovani.svg?v=${CACHE_BUSTER}" \
              && python3 - /tmp/public-version.txt /tmp/public-article.html <<'PY'
          from html import unescape
          from pathlib import Path
          import re
          import sys

          version = Path(sys.argv[1]).read_text(encoding='utf-8')
          markup = Path(sys.argv[2]).read_text(encoding='utf-8')

          def plain(value: str) -> str:
              return ' '.join(unescape(re.sub(r'<[^>]+>', ' ', value)).split())

          kicker_match = re.search(r'class="article-kicker"[^>]*>([\s\S]*?)</div>', markup, re.I)
          hero_match = re.search(r'<img\b[^>]*class=["\'][^"\']*hero-image[^"\']*["\'][^>]*>', markup, re.I)
          hero_src_match = re.search(r'\bsrc=["\']([^"\']+)["\']', hero_match.group(0), re.I) if hero_match else None
          kicker = plain(kicker_match.group(1)) if kicker_match else ''
          hero_src = hero_src_match.group(1) if hero_src_match else ''
          visible = plain(markup)
          banned = [
              'Rychlé shrnutí článku',
              'hlavní klíčové slovo',
              'SEO 90+',
              'produktový XML feed',
              'affiliate doporučení',
          ]

          ok = (
              'expected-cultivation-category: Pěstování bylinek' in version
              and kicker == 'Pěstování bylinek'
              and '/obrazky/pestovani.svg' in hero_src
              and not any(phrase.casefold() in visible.casefold() for phrase in banned)
          )
          print(f'Public check: kicker={kicker!r}, hero={hero_src!r}, ok={ok}.')
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "Production deployment verified successfully."
              exit 0
            fi

            echo "Production alias verification failed (attempt $attempt/12). Waiting 10 seconds..."
            sleep 10
          done

          echo "The public production address did not pass content verification."
          exit 1
