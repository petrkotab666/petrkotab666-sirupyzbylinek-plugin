name: Deploy SirupyZBylinek to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sirupyzbylinek-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and verify
    if: github.event_name != 'pull_request' || github.head_ref == 'force-cloudflare-production-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and audit site
        working-directory: site
        run: npm run build

      - name: Force production branch to main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"

          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.production_branch == "main"' >/dev/null
          echo "Cloudflare production branch is main."

      - name: Deploy production with current Wrangler
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="${CLOUDFLARE_PROJECT_NAME}" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Controlled production deployment" \
            --commit-dirty=true | tee /tmp/wrangler-output.txt

          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9]+\.sirupyzbylinek-astro\.pages\.dev' /tmp/wrangler-output.txt | tail -n 1)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment URL: $DEPLOYMENT_URL"

      - name: Inspect Cloudflare deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"

          MATCH="$(printf '%s' "$RESPONSE" | jq -c --arg sha "$GITHUB_SHA" '[.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)][0]')"
          if [ "$MATCH" = "null" ] || [ -z "$MATCH" ]; then
            echo "Could not find the deployment created by this workflow."
            printf '%s' "$RESPONSE" | jq -r '.result[0:5][] | [.id, .environment, .url, .deployment_trigger.metadata.branch, .deployment_trigger.metadata.commit_hash] | @tsv'
            exit 1
          fi

          printf '%s' "$MATCH" | jq -r '"Deployment id: \(.id)\nEnvironment: \(.environment)\nURL: \(.url)\nAliases: \((.aliases // []) | join(", "))\nBranch: \(.deployment_trigger.metadata.branch)"'
          printf '%s' "$MATCH" | jq -e '.latest_stage.status == "success" and .environment == "production"' >/dev/null

      - name: Verify uploaded deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          VERSION="$(curl -fsS --max-time 20 "${DEPLOYMENT_URL}/deploy-version.txt")"
          ARTICLE="$(curl -fsS --max-time 20 "${DEPLOYMENT_URL}/nejcastejsi-chyby-pri-pestovani-bylinek/")"

          printf '%s' "$VERSION" | grep -q 'expected-cultivation-category: Pěstování bylinek'
          printf '%s' "$ARTICLE" | grep -q 'Pěstování bylinek'
          printf '%s' "$ARTICLE" | grep -q '/obrazky/pestovani.svg'
          ! printf '%s' "$ARTICLE" | grep -Eiq 'Rychlé shrnutí článku|hlavní klíčové slovo|SEO 90\+|produktový XML feed|affiliate doporučení'
          echo "Uploaded deployment content verified successfully."

      - name: Verify public production alias
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            VERSION="$(curl -fsS --max-time 20 'https://sirupyzbylinek-astro.pages.dev/deploy-version.txt' || true)"
            ARTICLE="$(curl -fsS --max-time 20 'https://sirupyzbylinek-astro.pages.dev/nejcastejsi-chyby-pri-pestovani-bylinek/' || true)"

            if printf '%s' "$VERSION" | grep -q 'expected-cultivation-category: Pěstování bylinek' \
              && printf '%s' "$ARTICLE" | grep -q 'Pěstování bylinek' \
              && printf '%s' "$ARTICLE" | grep -q '/obrazky/pestovani.svg' \
              && ! printf '%s' "$ARTICLE" | grep -Eiq 'Rychlé shrnutí článku|hlavní klíčové slovo|SEO 90\+|produktový XML feed|affiliate doporučení'; then
              echo "Production deployment verified successfully."
              exit 0
            fi

            echo "Production alias is not updated yet (attempt $attempt/18). Waiting 10 seconds..."
            sleep 10
          done

          echo "The deployment is valid, but the production alias did not update."
          exit 1
