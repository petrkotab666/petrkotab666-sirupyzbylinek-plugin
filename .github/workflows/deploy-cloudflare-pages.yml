name: Deploy SirupyZBylinek to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['site/**','.github/workflows/deploy-cloudflare-pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**','.github/workflows/deploy-cloudflare-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: sirupyzbylinek-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    name: Build, deploy and verify
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'force-cloudflare-production-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Repository secret CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi
      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Prepare generated assets and content
        working-directory: site
        run: npm run prebuild
      - name: Build Astro site
        working-directory: site
        run: npx astro build
      - name: Generate legacy redirects
        working-directory: site
        run: node scripts/generate-legacy-redirects.mjs
      - name: Deduplicate built article images
        working-directory: site
        run: node scripts/deduplicate-built-article-images.mjs
      - name: Strip built editorial residue
        working-directory: site
        run: node scripts/strip-built-editorial-residue.mjs
      - name: Patch site audit
        working-directory: site
        run: node scripts/patch-site-audit.mjs
      - name: Audit built site
        working-directory: site
        run: node scripts/audit-built-site.mjs
      - name: Audit Herb Master
        working-directory: site
        run: node scripts/audit-herb-master.mjs
      - name: Audit full site
        working-directory: site
        run: node scripts/audit-full-site.mjs
      - name: Audit restored directories
        working-directory: site
        run: node scripts/audit-restored-directories.mjs
      - name: Audit restored site
        working-directory: site
        run: node scripts/audit-restored-site.mjs
      - name: Audit hub visuals
        working-directory: site
        run: node scripts/audit-hub-visuals.mjs
      - name: Audit content integrity
        working-directory: site
        run: node scripts/audit-content-integrity.mjs
      - name: Audit preparation heroes
        working-directory: site
        run: node scripts/audit-preparation-heroes.mjs
      - name: Force production branch to main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --request PATCH "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json" --data '{"production_branch":"main"}')"
          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.production_branch == "main"' >/dev/null
      - name: Deploy production with Wrangler
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name="${CLOUDFLARE_PROJECT_NAME}" --branch=main --commit-hash="${GITHUB_SHA}" --commit-message="Controlled production deployment" --commit-dirty=true | tee /tmp/wrangler-output.txt
          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9]+\.sirupyzbylinek-astro\.pages\.dev' /tmp/wrangler-output.txt | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Confirm active production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.canonical_deployment.environment == "production" and .result.canonical_deployment.deployment_trigger.metadata.branch == "main" and .result.canonical_deployment.latest_stage.status == "success"' >/dev/null
      - name: Verify uploaded deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/deploy-version.txt" -o /tmp/deploy-version.txt
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/nejcastejsi-chyby-pri-pestovani-bylinek/" -o /tmp/article.html
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/jak-uchovat-cerstve-bylinky/" -o /tmp/clean-article.html
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/" -o /tmp/home.html
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/domu/prirodni-lekarna/" -o /tmp/health.html
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/osvedcene-recepty/" -o /tmp/recipes.html
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/site-audit.json" -o /tmp/site-audit.json
          curl -fsS --max-time 30 "${DEPLOYMENT_URL}/hub-visual-audit.json" -o /tmp/hub-visual-audit.json
          jq -e '.errors | length == 0' /tmp/site-audit.json >/dev/null
          jq -e '.errors | length == 0' /tmp/hub-visual-audit.json >/dev/null
          rm -f /tmp/uploaded-health-*.webp
          for IMAGE in \
            3obr-07cd0380.webp \
            byliny-6083d43d.webp \
            sirupyuvod-78eb30cb.webp \
            sklenice-na-sirupy-a-zavarovani-4b170c4d.webp \
            byliny-300x300-eca005d2.webp \
            bylinkovymagazin-58281674.webp \
            kontryhel-obecny-caj-sber-suseni-40c765ff.webp \
            3obr-07cd0380-mirror.webp \
            byliny-6083d43d-mirror.webp \
            sirupyuvod-78eb30cb-mirror.webp \
            sklenice-na-sirupy-a-zavarovani-4b170c4d-mirror.webp \
            byliny-300x300-eca005d2-mirror.webp \
            bylinkovymagazin-58281674-mirror.webp \
            kontryhel-obecny-caj-sber-suseni-40c765ff-mirror.webp \
            bylinkova-herna-photo.webp \
            masti-a-balzamy-v2.webp; do
            curl -fsS --max-time 30 "${DEPLOYMENT_URL}/media/generated/prirodni-lekarna/${IMAGE}" -o "/tmp/uploaded-health-${IMAGE}"
          done
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('/tmp').glob('uploaded-health-*.webp'))
          if len(files) != 16:
              raise SystemExit(f'Expected 16 uploaded WebP assets, found {len(files)}')
          for file in files:
              header = file.read_bytes()[:12]
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP asset: {file}')
          print(f'Validated {len(files)} uploaded photographic WebP assets.')
          PY
          python3 site/scripts/verify-deployed-article.py /tmp/deploy-version.txt /tmp/article.html /tmp/home.html /tmp/health.html /tmp/recipes.html /tmp/clean-article.html
      - name: Verify public production address
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            CACHE_BUSTER="$(date +%s)-${attempt}"; BASE="https://sirupyzbylinek-astro.pages.dev"
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/deploy-version.txt?v=${CACHE_BUSTER}" -o /tmp/public-version.txt \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/nejcastejsi-chyby-pri-pestovani-bylinek/?v=${CACHE_BUSTER}" -o /tmp/public-article.html \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/jak-uchovat-cerstve-bylinky/?v=${CACHE_BUSTER}" -o /tmp/public-clean-article.html \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/?v=${CACHE_BUSTER}" -o /tmp/public-home.html \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/domu/prirodni-lekarna/?v=${CACHE_BUSTER}" -o /tmp/public-health.html \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/osvedcene-recepty/?v=${CACHE_BUSTER}" -o /tmp/public-recipes.html \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/site-audit.json?v=${CACHE_BUSTER}" -o /tmp/public-site-audit.json \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/hub-visual-audit.json?v=${CACHE_BUSTER}" -o /tmp/public-hub-visual-audit.json; then
              rm -f /tmp/public-health-*.webp
              WEBP_OK=1
              for IMAGE in \
                3obr-07cd0380.webp \
                byliny-6083d43d.webp \
                sirupyuvod-78eb30cb.webp \
                sklenice-na-sirupy-a-zavarovani-4b170c4d.webp \
                byliny-300x300-eca005d2.webp \
                bylinkovymagazin-58281674.webp \
                kontryhel-obecny-caj-sber-suseni-40c765ff.webp \
                3obr-07cd0380-mirror.webp \
                byliny-6083d43d-mirror.webp \
                sirupyuvod-78eb30cb-mirror.webp \
                sklenice-na-sirupy-a-zavarovani-4b170c4d-mirror.webp \
                byliny-300x300-eca005d2-mirror.webp \
                bylinkovymagazin-58281674-mirror.webp \
                kontryhel-obecny-caj-sber-suseni-40c765ff-mirror.webp \
                bylinkova-herna-photo.webp \
                masti-a-balzamy-v2.webp; do
                if ! curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${BASE}/media/generated/prirodni-lekarna/${IMAGE}?v=${CACHE_BUSTER}" -o "/tmp/public-health-${IMAGE}"; then
                  WEBP_OK=0
                  break
                fi
              done
              if [ "$WEBP_OK" = 1 ]; then
                if python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('/tmp').glob('public-health-*.webp'))
          if len(files) != 16:
              raise SystemExit(1)
          for file in files:
              header = file.read_bytes()[:12]
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  raise SystemExit(1)
          print(f'Validated {len(files)} public photographic WebP assets.')
          PY
                then
                  if jq -e '.errors | length == 0' /tmp/public-site-audit.json >/dev/null \
                    && jq -e '.errors | length == 0' /tmp/public-hub-visual-audit.json >/dev/null \
                    && python3 site/scripts/verify-deployed-article.py /tmp/public-version.txt /tmp/public-article.html /tmp/public-home.html /tmp/public-health.html /tmp/public-recipes.html /tmp/public-clean-article.html; then
                    echo "Production deployment verified successfully."
                    exit 0
                  fi
                fi
              fi
            fi
            echo "Production verification failed (attempt $attempt/12). Waiting 10 seconds..."
            sleep 10
          done
          exit 1