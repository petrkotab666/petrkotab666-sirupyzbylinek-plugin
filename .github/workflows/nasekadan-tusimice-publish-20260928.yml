name: Naše Kadaň – dokončit publikaci Tušimice 28.9.2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasekadan-tusimice-publish-20260928.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      K1: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      K2: ${{ secrets.OVH_SSH_KEY }}
      K3: ${{ secrets.SSH_PRIVATE_KEY }}
      K4: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      K5: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Vybrat existující SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key=''
          for n in K1 K2 K3 K4 K5; do
            v="${!n:-}"
            if [ -n "$v" ]; then key="$v"; break; fi
          done
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > /tmp/nk-key
          chmod 600 /tmp/nk-key
      - name: Spustit existující nativní bridge na OVH
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i /tmp/nk-key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ubuntu@57.129.43.215 'sudo systemctl start nasekadan-bridge-sync.service && sudo systemctl --no-pager --full status nasekadan-bridge-sync.service | tail -n 30'
      - name: Ověřit článek a titulku
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 12); do
            q="${GITHUB_RUN_ID}-$i-$(date +%s)"
            a="$(curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/tusimice-navyseni-kapacity-odpady-eia-2026.html?v=$q" || true)"
            h="$(curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/?v=$q" || true)"
            c="$(curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/?v=$q" || true)"
            if grep -Fq 'Do Tušimic může mířit více odpadu' <<<"$a" && grep -Fq 'tusimice-navyseni-kapacity-odpady-eia-2026.html' <<<"$h" && grep -Fq 'tusimice-navyseni-kapacity-odpady-eia-2026.html' <<<"$c"; then
              echo TUSIMICE_WEB_OK
              exit 0
            fi
            sleep 3
          done
          echo 'Veřejné ověření neprošlo.'
          exit 1
