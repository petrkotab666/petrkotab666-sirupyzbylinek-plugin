name: Visual preview original assets

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/visual-preview-original-assets.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Start static server
        run: |
          python3 -m http.server 4321 --directory site/dist >/tmp/sirupy-preview.log 2>&1 &
          echo $! > /tmp/sirupy-preview.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sirupy-preview.log
          exit 1
      - name: Capture desktop screenshots
        run: |
          mkdir -p visual-preview
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1200 \
            --screenshot=visual-preview/home-desktop.png \
            http://127.0.0.1:4321/
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1200 \
            --screenshot=visual-preview/sber-desktop.png \
            http://127.0.0.1:4321/domu/sber-bylinek/
      - name: Capture mobile screenshots
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=430,1100 \
            --screenshot=visual-preview/home-mobile.png \
            http://127.0.0.1:4321/
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=430,1100 \
            --screenshot=visual-preview/sber-mobile.png \
            http://127.0.0.1:4321/domu/sber-bylinek/
      - uses: actions/upload-artifact@v4
        with:
          name: original-assets-visual-preview
          path: visual-preview/*.png
          if-no-files-found: error
          retention-days: 3
