name: Research attendance 2024-11-06
on:
  push:
    branches:
      - tmp-attendance-view-20241106
    paths:
      - '.github/workflows/research-attendance-20241106.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q faster-whisper
      - name: Extract five minutes around meeting start
        shell: bash
        run: |
          set -euxo pipefail
          HLS='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/4596793a-66a9-4cf5-b40e-0bb973996508-master.m3u8'
          ffmpeg -hide_banner -loglevel warning -y -ss 210 -i "$HLS" -t 300 -vn -ar 16000 -ac 1 -c:a pcm_s16le /tmp/opening.wav
      - name: Transcribe and print opening
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          names='Jan Losenický, Jan Vaic, Tomáš Oršulák, Stanislav Hakl, Petr Hossner, Alena Benešová, Jiří Kulhánek, Radek Oswald, Jiří Jerie, Adam Studený, Josef Steiner, Michal Voltr, Aleš Padrta, Zdeněk Hosman, Martina Matoušková Faldusová, Pavel Neprášek, Stanislava Pardubská, Miloš Wendl, Pavel Zárybnický, Jana Demjanová, Jan Lazarčík, Miroslav Novotný, Miloslav Straka, Jiří Švec, Jindra Zalabáková, Radek Jára, Jan Zach.'
          model=WhisperModel('base',device='cpu',compute_type='int8')
          segs,info=model.transcribe('/tmp/opening.wav',language='cs',beam_size=5,vad_filter=True,initial_prompt='Mimořádné zasedání zastupitelstva města Kadaň. Jména zastupitelů: '+names)
          print('=== TRANSCRIPT START offset_video_sec=210 ===')
          for s in segs:
              print(f'[{s.start+210:07.2f}-{s.end+210:07.2f}] {s.text.strip()}')
          print('=== TRANSCRIPT END ===')
          PY
