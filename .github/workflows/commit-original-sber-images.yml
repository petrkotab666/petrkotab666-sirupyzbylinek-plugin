name: Commit original Sber images

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/commit-original-sber-images.yml'

permissions:
  contents: write

jobs:
  commit-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download exact original image files
        run: |
          set -euo pipefail
          TARGET='site/public/media/original/sber'
          mkdir -p "$TARGET"

          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/kdysbiratbylinky.png' \
            -o "$TARGET/kdy-sbirat.webp"
          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/cosbirat.png' \
            -o "$TARGET/co-sbirat.webp"
          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/etikasberu.png' \
            -o "$TARGET/etika-sberu.webp"
          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/conesbirat1-1024x1024.png' \
            -o "$TARGET/co-nesbirat.webp"
          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/kamsbiratbylinky.png' \
            -o "$TARGET/kde-sbirat.webp"
          curl -fsSL -H 'Accept: image/webp,image/*;q=0.9' \
            'https://www.sirupyzbylinek.cz/wp-content/uploads/2026/02/zpracovanibylin.png' \
            -o "$TARGET/zpracovani-bylin.webp"

          for file in "$TARGET"/*.webp; do
            test -s "$file"
            file "$file" | grep -qi 'Web/P image'
          done

      - name: Commit original files to the pull request branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public/media/original/sber/*.webp
          if git diff --cached --quiet; then
            echo 'Original images are already committed.'
            exit 0
          fi
          git commit -m 'Uložit přesné původní obrázky rozcestníku Sběr bylinek'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
