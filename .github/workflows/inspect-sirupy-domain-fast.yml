name: Inspect SirupyZBylinek custom domain fast

on:
  push:
    paths:
      - '.github/workflows/inspect-sirupy-domain-fast.yml'
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro
    steps:
      - name: Verify Pages production before domain switch
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://sirupyzbylinek-astro.pages.dev/ -o /tmp/pages-home.html
          grep -Fq 'Vyberte si cestu do světa bylinek' /tmp/pages-home.html
          curl -fsS --max-time 30 https://sirupyzbylinek-astro.pages.dev/site-audit.json -o /tmp/site-audit.json
          jq -e '.errors | length == 0' /tmp/site-audit.json >/dev/null
      - name: Inspect current DNS and HTTP
        run: |
          set -euo pipefail
          echo '=== NS ==='
          dig +short NS sirupyzbylinek.cz || true
          echo '=== apex ==='
          dig +short A sirupyzbylinek.cz || true
          dig +short AAAA sirupyzbylinek.cz || true
          dig +short CNAME sirupyzbylinek.cz || true
          echo '=== www ==='
          dig +short A www.sirupyzbylinek.cz || true
          dig +short AAAA www.sirupyzbylinek.cz || true
          dig +short CNAME www.sirupyzbylinek.cz || true
          echo '=== HTTP apex ==='
          curl -sSIL --max-time 30 https://sirupyzbylinek.cz/ | sed -n '1,12p' || true
          echo '=== HTTP www ==='
          curl -sSIL --max-time 30 https://www.sirupyzbylinek.cz/ | sed -n '1,12p' || true
      - name: Inspect Cloudflare Pages custom domains and zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsS --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' -o /tmp/domains.json
          echo '=== Pages custom domains ==='
          jq '{success, domains: [.result[]? | {name,status,validation_data,verification_data,zone_tag}], errors}' /tmp/domains.json
          HTTP=$(curl -sS --max-time 30 -o /tmp/zones.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones?name=sirupyzbylinek.cz&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')
          echo "=== zones_http=${HTTP} ==="
          jq '{success, zones: [.result[]? | {id,name,status,name_servers}], errors}' /tmp/zones.json || cat /tmp/zones.json
