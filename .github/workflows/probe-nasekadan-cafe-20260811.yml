name: Ověřit živé Naše Kadaň – Cafe Lingua

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nasekadan-cafe-20260811.yml'
      - '.github/probe-nasekadan-cafe.trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ověřit kulturní přehled a stav nasazení
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          url='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html'
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 30 -H 'Cache-Control: no-cache' "$url?probe=$stamp" -o /tmp/kultura.html || true
          curl -4 -kfsSL --max-time 30 -H 'Cache-Control: no-cache' "https://nasekadan.cz/deployment-health.txt?probe=$stamp" -o /tmp/health.txt || true
          curl -4 -kfsSL --max-time 30 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/slunce-kadan-posledni-tyden-pronajem-292-korun-2026.html?probe=$stamp" -o /tmp/slunce.html || true
          cafe=no
          slunce=no
          grep -Fq 'Cafe Lingua Poland v RADCE' /tmp/kultura.html 2>/dev/null && cafe=yes
          grep -Fq 'Poslední týden pro Slunce' /tmp/slunce.html 2>/dev/null && slunce=yes
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            echo "cafe_lingua_live=$cafe"
            echo "slunce_live=$slunce"
            echo '--- deployment-health ---'
            cat /tmp/health.txt 2>/dev/null || true
          } > reports/nasekadan-cafe-live.txt
          cat reports/nasekadan-cafe-live.txt
      - name: Uložit výsledek
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nasekadan-cafe-live.txt
          git commit -m 'Zapsat kontrolu Cafe Lingua na Naše Kadaň [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
