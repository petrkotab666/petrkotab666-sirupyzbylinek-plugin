name: tmp-storyboard-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and split storyboard
        run: |
          mkdir -p out/frames
          curl -L --fail --retry 3 'https://tv.pirati.cz/lazy-static/storyboards/3ec4b1a8-d659-442a-8e59-6bb3d32b1e32.jpg' -o out/storyboard.jpg
          ffprobe -v error -show_entries stream=width,height -of csv=p=0:s=x out/storyboard.jpg
          n=0
          for row in $(seq 0 10); do
            for col in $(seq 0 10); do
              x=$((col*192)); y=$((row*108));
              ffmpeg -hide_banner -loglevel error -i out/storyboard.jpg -vf "crop=192:108:${x}:${y},scale=1536:864:flags=neighbor" -frames:v 1 "out/frames/frame_$(printf '%03d' $n).png"
              n=$((n+1))
            done
          done
          echo "FRAMES=$n"
      - name: Upload storyboard frames
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-frames-20241106
          path: out/
          retention-days: 1
