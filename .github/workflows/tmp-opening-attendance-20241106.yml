name: tmp-opening-attendance-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcribe opening precisely
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
          HLS='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/4596793a-66a9-4cf5-b40e-0bb973996508-master.m3u8'
          ffmpeg -hide_banner -loglevel error -ss 0 -t 90 -i "$HLS" -vn -ac 1 -ar 16000 -af 'volume=3' -y out/opening.wav
          python3 -m pip install --quiet faster-whisper
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          prompt='Mimořádné zastupitelstvo města Kadaň. Přítomní a omluvení zastupitelé: Tomáš Oršulák, Stanislav Hakl, Petr Hossner, Alena Benešová, Jiří Kulhánek, Jan Losenický, Radek Oswald, Jiří Jerie, Adam Studený, Josef Steiner, Jan Vaic, Michal Voltr, Aleš Padrta, Zdeněk Hosman, Martina Matoušková Faldusová, Pavel Neprášek, Stanislava Pardubská, Miloš Wendl, Pavel Zárybnický, Jana Demjanová, Jan Lazarčík, Miroslav Novotný, Miloslav Straka, Jiří Švec, Jindra Zalabáková, Radek Jára, Jan Zach. Omluven, přítomno, zastupitelů.'
          model=WhisperModel('medium', device='cpu', compute_type='int8')
          segs,info=model.transcribe('out/opening.wav', language='cs', beam_size=10, best_of=10, vad_filter=False, initial_prompt=prompt, condition_on_previous_text=True, temperature=0)
          with open('out/opening.txt','w',encoding='utf-8') as f:
            for s in segs:
              line=f'[{s.start:06.2f}-{s.end:06.2f}] {s.text.strip()}'
              print(line); f.write(line+'\n')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: opening-attendance-20241106
          path: out/opening.txt
          retention-days: 1
