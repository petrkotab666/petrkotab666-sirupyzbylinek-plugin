name: Naše Kadaň – nezávislý živý audit

on:
  push:
    branches: [main]
    paths:
      - 'nasekadan-live/audit_live_site.py'
      - 'nasekadan-live/live-audit-trigger.txt'
      - '.github/workflows/nasekadan-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-independent-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnostika veřejného CSS reklam
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 20 'https://nasekadan.cz/deployment-health.txt?audit=adcss-20260912' -o /tmp/health.txt
          curl -fsSL --max-time 20 'https://nasekadan.cz/style.css?audit=adcss-20260912' -o /tmp/style.css
          curl -fsSL --max-time 20 'https://nasekadan.cz/ad-fallback-fix.js?audit=adcss-20260912' -o /tmp/ad-fallback-fix.js
          echo '--- HEALTH ---'
          cat /tmp/health.txt
          echo '--- CSS SIZE ---'
          wc -c /tmp/style.css
          echo '--- AD JS SIZE ---'
          wc -c /tmp/ad-fallback-fix.js
          python - <<'PY'
          from pathlib import Path
          css=Path('/tmp/style.css').read_text(encoding='utf-8',errors='replace')
          js=Path('/tmp/ad-fallback-fix.js').read_text(encoding='utf-8',errors='replace')
          needles=[
            '.promo-card:not(:has(.promo-banner))::before',
            '.promo-card-wide.promo-card-full-image:not(:has(.promo-banner img))::before',
            'radial-gradient(circle at 25% 78%',
            'NK_AD_BLANK_VISUAL_GUARD_20260912',
          ]
          for needle in needles:
            print('\n--- NEEDLE',needle,'---')
            start=0
            hits=[]
            while True:
              i=css.find(needle,start)
              if i<0: break
              hits.append(i); start=i+1
            print('hits=',hits[:20], 'count=',len(hits))
            for i in hits[:5]:
              print(css[max(0,i-500):min(len(css),i+1400)])
          print('\n--- JS MARKERS ---')
          for needle in ['NK_AD_REAL_COPY_V4_20260910','function inspect(card)','promo-banner-fallback']:
            print(needle, js.find(needle))
          PY
