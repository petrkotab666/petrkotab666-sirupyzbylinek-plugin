name: Naše Kadaň – nezávislý živý audit

on:
  push:
    branches: [main]
    paths:
      - 'nasekadan-live/audit_live_site.py'
      - 'nasekadan-live/visual_browser_audit.py'
      - 'nasekadan-live/live-audit-trigger.txt'
      - '.github/workflows/nasekadan-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-independent-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit vizuální hotfix a pořídit kontrolní screenshot
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=0
          for i in $(seq 1 24); do
            q="${GITHUB_RUN_ID}-$i-$(date +%s)"
            css="$(curl -4 -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/style.css?visual_check=$q" || true)"
            if grep -Fq 'NK_VISUAL_LAYOUT_GUARD_20260913' <<<"$css"; then
              echo 'VISUAL_HOTFIX_PUBLIC_OK'
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p nasekadan-live
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1000 \
            --screenshot=nasekadan-live/visual-target-after.png \
            "https://nasekadan.cz/clanky/kadansky-klaster-vratte-nam-knihy-1986.html?visual_check=${GITHUB_RUN_ID}-$(date +%s)"
          test -s nasekadan-live/visual-target-after.png

      - name: Nainstalovat nástroje pro skutečný browserový audit
        run: python -m pip install --quiet playwright

      - name: Ověřit syntaxi auditů
        run: |
          python -m py_compile nasekadan-live/audit_live_site.py
          python -m py_compile nasekadan-live/visual_browser_audit.py

      - name: Projít celý veřejný web v reálném browseru
        run: python nasekadan-live/visual_browser_audit.py

      - name: Projít celý veřejný web technickým auditem
        run: python nasekadan-live/audit_live_site.py

      - name: Vytvořit kompaktní technický souhrn
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          src=Path('nasekadan-live/live-audit-report.json')
          if not src.exists():
              raise SystemExit('Chybí live-audit-report.json')
          report=json.loads(src.read_text(encoding='utf-8'))
          errors=report.get('errors') or []
          warnings=report.get('warnings') or []
          summary={
              'status':report.get('status'),
              'started_at':report.get('started_at'),
              'finished_at':report.get('finished_at'),
              'sitemap_urls':report.get('sitemap_urls'),
              'html_pages_checked':report.get('html_pages_checked'),
              'article_pages_checked':report.get('article_pages_checked'),
              'images_checked':report.get('images_checked'),
              'internal_links_checked':report.get('internal_links_checked'),
              'error_count':len(errors),
              'warning_count':len(warnings),
              'error_types':dict(Counter(str(x.get('type')) for x in errors)),
              'warning_types':dict(Counter(str(x.get('type')) for x in warnings)),
              'errors':errors,
              'warnings':warnings,
          }
          Path('nasekadan-live/live-audit-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:summary[k] for k in ('status','error_count','warning_count','error_types','warning_types')},ensure_ascii=False,indent=2))
          PY

      - name: Uložit auditní reporty
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s nasekadan-live/live-audit-report.json || exit 1
          test -s nasekadan-live/live-audit-summary.json || exit 1
          test -s nasekadan-live/visual-browser-audit.json || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nasekadan-live/live-audit-report.json nasekadan-live/live-audit-summary.json nasekadan-live/visual-browser-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Aktualizovat technický a browserový vizuální audit Naše Kadaň [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasekadan-full-visual-browser-audit
          path: |
            nasekadan-live/visual-target-after.png
            nasekadan-live/visual-browser-audit.json
            nasekadan-live/visual-findings/*.png
          if-no-files-found: ignore
