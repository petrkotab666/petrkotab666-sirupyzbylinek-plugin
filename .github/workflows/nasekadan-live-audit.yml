name: Naše Kadaň – nezávislý živý audit

on:
  push:
    branches: [main]
    paths:
      - 'nasekadan-live/audit_live_site.py'
      - 'nasekadan-live/live-audit-trigger.txt'
      - '.github/workflows/nasekadan-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-independent-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ověřit syntaxi
        run: python -m py_compile nasekadan-live/audit_live_site.py
      - name: Projít skutečný veřejný web
        run: python nasekadan-live/audit_live_site.py
      - name: Uložit auditní report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s nasekadan-live/live-audit-report.json || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nasekadan-live/live-audit-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Aktualizovat nezávislý audit Naše Kadaň [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
