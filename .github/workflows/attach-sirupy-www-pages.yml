name: Attach www.sirupyzbylinek.cz to Cloudflare Pages

on:
  push:
    paths:
      - '.github/workflows/attach-sirupy-www-pages.yml'
  workflow_dispatch:

permissions: {}

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro
      DOMAIN: www.sirupyzbylinek.cz
    steps:
      - name: Verify current Pages production
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://sirupyzbylinek-astro.pages.dev/ -o /tmp/home.html
          grep -Fq 'Vyberte si cestu do světa bylinek' /tmp/home.html
      - name: Attach www custom domain if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains"
          curl -fsS --max-time 30 "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' -o /tmp/list.json
          if jq -e --arg d "$DOMAIN" '.result[]? | select(.name == $d)' /tmp/list.json >/dev/null; then
            echo "$DOMAIN is already attached."
          else
            HTTP=$(curl -sS --max-time 30 -o /tmp/create.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${DOMAIN}\"}")
            echo "create_http=${HTTP}"
            jq '{success, result: (.result | {name,status,validation_data,verification_data,zone_tag}), errors, messages}' /tmp/create.json
            jq -e '.success == true' /tmp/create.json >/dev/null
          fi
      - name: Show current custom-domain status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${DOMAIN}"
          curl -fsS --max-time 30 "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' -o /tmp/domain.json
          jq '{success, result: (.result | {name,status,validation_data,verification_data,zone_tag}), errors}' /tmp/domain.json
