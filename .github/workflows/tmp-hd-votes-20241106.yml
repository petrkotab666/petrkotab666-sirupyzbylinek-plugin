name: tmp-hd-votes-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 720p and extract first vote screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out/firstvote
          URL='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/a1a2a001-6aa2-41be-9022-8651538d2d93-720-fragmented.mp4'
          curl -L --fail --retry 3 "$URL" -o out/video720.mp4
          ffmpeg -hide_banner -loglevel error -ss 130 -t 50 -i out/video720.mp4 -vf 'fps=2,scale=1280:-2' -q:v 2 out/firstvote/frame_%03d.jpg
      - name: Upload HD frames
        uses: actions/upload-artifact@v4
        with:
          name: first-vote-frames-20241106
          path: out/firstvote/
          retention-days: 1
