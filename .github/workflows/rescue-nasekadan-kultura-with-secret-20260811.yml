name: Jednorázově opravit celý nativní provoz Naše Kadaň na OVH

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rescue-nasekadan-kultura-with-secret-20260811.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      K1: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      K2: ${{ secrets.OVH_SSH_KEY }}
      K3: ${{ secrets.SSH_PRIVATE_KEY }}
      K4: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      K5: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vybrat existující servisní SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key=''
          for n in K1 K2 K3 K4 K5; do
            v="${!n:-}"
            if [ -n "$v" ]; then key="$v"; echo "SSH_KEY_AVAILABLE=$n"; break; fi
          done
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > /tmp/nk-key
          chmod 600 /tmp/nk-key

      - name: Přenést veřejný recovery balík na vlastní OVH
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i /tmp/nk-key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -r \
            nasekadan-live/recovery/20260905 \
            ubuntu@57.129.43.215:/tmp/nasekadan-recovery-20260905

      - name: Opravit obsah, bridge, runnery, SentinelX a nativní systemd
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i /tmp/nk-key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ubuntu@57.129.43.215 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/nasekadan
          APP=/opt/nasekadan
          BUNDLE=/tmp/nasekadan-recovery-20260905
          WEEKLY=clanky/kam-v-kadani-a-okoli-31-srpna-6-zari-2026.html
          echo "HOST=$(hostname) NOW=$(date -Is)"
          test -d "$ROOT"

          # 1) Nový veřejný přehled zdrojů.
          install -d -m 0755 "$ROOT/prehled-zdroju" "$ROOT/data"
          install -m 0644 "$BUNDLE/prehled-zdroju/index.html" "$ROOT/prehled-zdroju/index.html"
          for f in city-sources.json regional-sources.json; do
            test -s "$BUNDLE/data/$f"
            install -m 0644 "$BUNDLE/data/$f" "$ROOT/data/$f"
          done

          # Registry existovaly v projektu už před dnešní změnou stránky; vezmeme jejich
          # aktuálně dostupnou serverovou kopii. Chybějící soubor je blokující chyba.
          for f in organizations.json culture-source-registry.json central-monitoring-runtime.json cultural-events-watchlist-2026.json; do
            if [ -s "$APP/data/$f" ]; then
              install -m 0644 "$APP/data/$f" "$ROOT/data/$f"
            elif [ ! -s "$ROOT/data/$f" ]; then
              echo "MISSING_REQUIRED_DATA=$f" >&2
              exit 21
            fi
          done

          # 2) Přesný idempotentní kulturní manifest aplikovat přímo na živý webroot.
          curl -4 -fsSL --max-time 30 \
            'https://raw.githubusercontent.com/petrkotab666/petrkotab666-sirupyzbylinek-plugin/main/nasekadan-live/manifest.json' \
            -o /tmp/nasekadan-current-manifest.json
          python3 - "$ROOT" /tmp/nasekadan-current-manifest.json <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          data=json.load(open(sys.argv[2],encoding='utf-8'))
          for patch in data.get('patches',[]):
              p=root/patch['path']
              if not p.is_file():
                  raise SystemExit(f'MISSING_PATCH_TARGET {p}')
              text=p.read_text(encoding='utf-8')
              old=patch['old']; new=patch['new']; expected=int(patch.get('count',1))
              n=text.count(old)
              if n==0 and new in text:
                  continue
              if n!=expected:
                  raise SystemExit(f'PATCH_COUNT_MISMATCH {p} expected={expected} got={n}')
              p.write_text(text.replace(old,new,expected),encoding='utf-8',newline='\n')
          print('DIRECT_MANIFEST_APPLIED',data.get('version'))
          PY

          # 3) Pokud nginx kontejner drží vlastní statickou kopii, dorovnat ji.
          if docker inspect nasekadan-web >/dev/null 2>&1; then
            docker exec nasekadan-web mkdir -p /usr/share/nginx/html/prehled-zdroju /usr/share/nginx/html/data /usr/share/nginx/html/clanky
            docker cp "$ROOT/prehled-zdroju/index.html" nasekadan-web:/usr/share/nginx/html/prehled-zdroju/index.html
            for f in organizations.json city-sources.json regional-sources.json culture-source-registry.json central-monitoring-runtime.json cultural-events-watchlist-2026.json; do
              docker cp "$ROOT/data/$f" "nasekadan-web:/usr/share/nginx/html/data/$f"
            done
            docker cp "$ROOT/$WEEKLY" "nasekadan-web:/usr/share/nginx/html/$WEEKLY"
          fi

          # 4) Oživit nativní bridge a publikační/monitorovací systemd služby.
          systemctl daemon-reload || true
          for u in nasekadan-bridge-sync.timer nasekadan-publish-queue.path nasekadan-publish-queue.timer nasekadan-breaking.timer nasekadan-infra-watchdog.timer nasekadan-refresh.timer nasekadan-main-sync.timer; do
            if systemctl list-unit-files --no-legend "$u" 2>/dev/null | grep -q "$(basename "$u")"; then
              systemctl enable "$u" 2>/dev/null || true
              systemctl restart "$u" 2>/dev/null || true
              echo "$u=$(systemctl is-active "$u" 2>/dev/null || true)"
            fi
          done
          systemctl reset-failed nasekadan-bridge-sync.service 2>/dev/null || true
          systemctl start nasekadan-bridge-sync.service 2>/dev/null || true

          # 5) Oživit všechny existující self-hosted runnery na OVH.
          systemctl list-unit-files --no-legend 'actions.runner.*.service' 2>/dev/null | awk '{print $1}' | while read -r u; do
            [ -n "$u" ] || continue
            systemctl enable "$u" 2>/dev/null || true
            systemctl restart "$u" 2>/dev/null || true
            echo "$u=$(systemctl is-active "$u" 2>/dev/null || true)"
          done

          # 6) Oživit SentinelX, pokud je na hostu nainstalovaný; žádné klíče nečteme.
          systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /sentinel/ {print $1}' | while read -r u; do
            [ -n "$u" ] || continue
            systemctl enable "$u" 2>/dev/null || true
            systemctl restart "$u" 2>/dev/null || true
            echo "$u=$(systemctl is-active "$u" 2>/dev/null || true)"
          done

          systemctl reload caddy 2>/dev/null || true
          systemctl reload nginx 2>/dev/null || true

          # 7) Lokální blokující kontrola obsahu.
          grep -Fq 'Co Naše Kadaň sleduje' "$ROOT/prehled-zdroju/index.html"
          for f in organizations.json city-sources.json regional-sources.json culture-source-registry.json central-monitoring-runtime.json cultural-events-watchlist-2026.json; do
            python3 -m json.tool "$ROOT/data/$f" >/dev/null
          done
          for m in cinovy-dul-jeronym-archeologicke-leto-20260905 zoopark-chomutov-zpatky-do-skoly-20260905-06 most-hraj-discgolf-tour-20260905 most-verejne-brusleni-20260905 most-mimoradne-verejne-brusleni-20260906; do
            grep -Fq "$m" "$ROOT/$WEEKLY"
          done

          echo '=== BRIDGE STATUS ==='
          cat "$ROOT/bridge-health.txt" 2>/dev/null || true
          systemctl --no-pager --full status nasekadan-bridge-sync.timer 2>/dev/null || true
          journalctl -u nasekadan-bridge-sync.service -n 80 --no-pager 2>/dev/null || true
          echo 'NASEKADAN_OVH_LOCAL_REPAIR_OK'
          REMOTE

      - name: Veřejný end-to-end důkaz
        shell: bash
        run: |
          set -Eeuo pipefail
          aurl='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-31-srpna-6-zari-2026.html'
          surl='https://nasekadan.cz/prehled-zdroju/'
          for i in $(seq 1 12); do
            q="${GITHUB_RUN_ID}-$i-$(date +%s)"
            a="$(curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' "$aurl?fullrepair=$q" || true)"
            s="$(curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' "$surl?fullrepair=$q" || true)"
            ok=1
            grep -Fq 'Co Naše Kadaň sleduje' <<<"$s" || ok=0
            grep -Fq 'id="stat-records">377<' <<<"$s" || ok=0
            for m in cinovy-dul-jeronym-archeologicke-leto-20260905 zoopark-chomutov-zpatky-do-skoly-20260905-06 most-hraj-discgolf-tour-20260905 most-verejne-brusleni-20260905 most-mimoradne-verejne-brusleni-20260906; do
              grep -Fq "$m" <<<"$a" || ok=0
            done
            if [ "$ok" -eq 1 ]; then
              for f in organizations.json city-sources.json regional-sources.json culture-source-registry.json central-monitoring-runtime.json cultural-events-watchlist-2026.json; do
                curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/data/$f?fullrepair=$q" | python3 -m json.tool >/dev/null || ok=0
              done
            fi
            if [ "$ok" -eq 1 ]; then echo 'NASEKADAN_FULL_WEB_OK'; exit 0; fi
            sleep 4
          done
          echo 'NASEKADAN_FULL_WEB_NOT_OK' >&2
          exit 1
