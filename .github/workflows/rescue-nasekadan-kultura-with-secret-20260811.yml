name: Záchranně nasadit kulturu Naše Kadaň přes SSH

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rescue-nasekadan-kultura-with-secret-20260811.yml']

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K1: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      K2: ${{ secrets.OVH_SSH_KEY }}
      K3: ${{ secrets.SSH_PRIVATE_KEY }}
      K4: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      K5: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Vybrat dostupný SSH klíč a nasadit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key=''
          for n in K1 K2 K3 K4 K5; do v="${!n:-}"; if [ -n "$v" ]; then key="$v"; echo "SSH_KEY_AVAILABLE=$n"; break; fi; done
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > /tmp/nk-key
          chmod 600 /tmp/nk-key
          ssh -i /tmp/nk-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 ubuntu@57.129.43.215 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          apt-get clean 2>/dev/null || true
          journalctl --vacuum-size=50M >/dev/null 2>&1 || true
          article=/var/www/nasekadan/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html
          test -s "$article"
          python3 - "$article" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8')
          marker='<h2>2. Kino, divadlo, výstavy a památky</h2>'
          cafe='''<div class="event" data-cafe-lingua-poland><time>ČTVRTEK 13. 8. · 16:00</time><p class="distance">Kadaň · RADKA, Kpt. Jaroše 630 · vstup zdarma</p><h3>Cafe Lingua Poland v RADCE</h3><p>RADKA zve ve čtvrtek na další setkání Cafe Lingua, tentokrát věnované Polsku. Akce začíná v <strong>16:00</strong> v prostorách RADKA z. s. na adrese Kpt. Jaroše 630. <strong>Vstup je zdarma.</strong></p></div>'''
          box='''<div class="event" data-back-to-school-boxing><time>NEDĚLE 16. 8. · 16:00</time><p class="distance">Kadaň · Mírové náměstí · vstup zdarma</p><h3>Zpátky do školy – v kondici: trénink boxu pro děti a rodiče</h3><p>Dobrý počin z. s. zve na společný trénink boxu pro <strong>děti ve věku 5–12 let a jejich rodiče</strong>. Akce se koná v neděli od 16:00 na Mírovém náměstí v Kadani. Pořadatel ji popisuje jako zábavnou, bezplatnou a otevřenou pro každého – cílem je před začátkem školy „rozpohybovat tělo i hlavu“.</p></div>'''
          if marker not in t: raise SystemExit('chybí kotva')
          add=''
          if 'data-cafe-lingua-poland' not in t: add += cafe
          if 'data-back-to-school-boxing' not in t: add += box
          if add: t=t.replace(marker,add+marker,1); p.write_text(t,encoding='utf-8',newline='\n')
          PY
          if docker inspect nasekadan-web >/dev/null 2>&1; then
            docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            docker cp "$article" nasekadan-web:/usr/share/nginx/html/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html
          fi
          systemctl reload caddy 2>/dev/null || true
          REMOTE
          url='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html'
          for i in $(seq 1 8); do
            curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' "$url?sshrescue=${GITHUB_RUN_ID}-$i-$(date +%s)" -o /tmp/live.html || true
            if grep -Fq 'Cafe Lingua Poland v RADCE' /tmp/live.html && grep -Fq 'Zpátky do školy – v kondici: trénink boxu pro děti a rodiče' /tmp/live.html; then echo LIVE_OK; exit 0; fi
            sleep 2
          done
          exit 1
