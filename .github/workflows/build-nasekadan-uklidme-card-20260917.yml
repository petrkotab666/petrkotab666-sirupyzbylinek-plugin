name: Naše Kadaň – OG karta Ukliďme Kadaň 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nasekadan-uklidme-card-20260917.yml'
      - 'nasekadan-live/uklidme-card-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vygenerovat kartu 1200x630 a checksumy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import hashlib
          W,H=1200,630
          navy=(2,25,37); navy2=(3,31,45); teal=(6,58,70); grid=(13,84,96)
          red=(194,31,48); muted=(166,195,202); green=(72,154,111)
          img=Image.new('RGB',(W,H),navy); d=ImageDraw.Draw(img)
          for y in range(H):
              t=y/(H-1); col=tuple(int(navy[i]*(1-t)+navy2[i]*t) for i in range(3)); d.line((0,y,760,y),fill=col)
          d.polygon([(760,0),(1200,0),(1200,H),(650,H)],fill=teal)
          for x in range(760,1201,44): d.line((x,0,x,H),fill=grid,width=1)
          for y in range(20,H,44): d.line((700,y,1200,y),fill=grid,width=1)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          fb=lambda n: ImageFont.truetype(bold,n); fr=lambda n: ImageFont.truetype(reg,n)
          d.text((54,48),'NAŠE KADAŇ',font=fb(28),fill='white')
          d.rectangle((54,91,430,95),fill=red)
          d.rounded_rectangle((54,119,230,153),radius=5,fill=green)
          d.text((72,127),'UKLIĎME KADAŇ',font=fb(16),fill='white')
          y=186
          for line in ('O víkendu se uklízí','celé Česko.','Přidá se i Kadaň?'):
              d.text((54,y),line,font=fb(42),fill='white'); y+=54
          d.text((54,372),'World Cleanup Day · 20. září 2026',font=fr(24),fill=muted)
          d.line((54,430,580,430),fill=(115,170,182),width=2)
          d.rounded_rectangle((54,455,465,492),radius=5,fill=(206,229,235))
          d.text((73,463),'AKTUÁLNĚ NA NASEKADAN.CZ',font=fb(16),fill=(3,28,42))
          d.ellipse((850,182,1080,405),fill=(198,229,220),outline=(232,247,242),width=6)
          d.polygon([(882,225),(1046,225),(1080,520),(838,520)],fill=(198,229,220))
          d.rounded_rectangle((866,198,1056,246),radius=20,fill=(142,202,178))
          d.line((902,226,892,177,930,210,960,168,982,211,1020,178,1018,226),fill=(237,249,245),width=9)
          d.rounded_rectangle((774,390,855,516),radius=28,fill=(244,198,66))
          for i,x in enumerate((782,800,818,836)): d.rounded_rectangle((x,338+i%2*6,x+14,420),radius=7,fill=(244,198,66))
          d.rounded_rectangle((1080,388,1155,510),radius=28,fill=(244,198,66))
          for i,x in enumerate((1084,1102,1120,1138)): d.rounded_rectangle((x,342+(i%2)*7,x+13,418),radius=7,fill=(244,198,66))
          for cx,cy in ((814,190),(1110,224),(1100,535),(790,540)):
              d.ellipse((cx-24,cy-12,cx+24,cy+12),fill=(116,195,133)); d.line((cx-18,cy,cx+18,cy),fill=(65,131,88),width=3)
          d.rounded_rectangle((1151,579,1184,612),radius=4,fill=red)
          d.text((1159,586),'NK',font=fb(13),fill='white')
          out=Path('nasekadan-live/files/social/uklidme-kadan-world-cleanup-day-20260917.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          img.save(out,format='PNG',optimize=True)
          Path(str(out)+'.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'\n',encoding='utf-8')
          article=Path('nasekadan-live/files/clanky/uklidme-kadan-world-cleanup-day-20260917.html')
          Path(str(article)+'.sha256').write_text(hashlib.sha256(article.read_bytes()).hexdigest()+'\n',encoding='utf-8')
          PY
      - name: Veřejný probe Naše Kadaň
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error,re,struct,hashlib
          from pathlib import Path
          base='https://nasekadan.cz'; slug='/clanky/uklidme-kadan-world-cleanup-day-20260917.html'; img='/social/uklidme-kadan-world-cleanup-day-20260917.png'
          def get(path,binary=False):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NaseKadanPublicProbe/20260917','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      b=r.read(); return r.status,dict(r.headers),b if binary else b.decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  b=e.read(); return e.code,dict(e.headers),b if binary else b.decode('utf-8','replace')
              except Exception as e: return 0,{'error':repr(e)},b'' if binary else ''
          ac,ah,ab=get(slug); ic,ih,ib=get(img,True); hc,hh,hb=get('/'); rc,rh,rb=get('/rss.xml'); sc,sh,sb=get('/sitemap.xml')
          dims=None
          if ic==200 and len(ib)>24 and ib[:8]==b'\x89PNG\r\n\x1a\n': dims=list(struct.unpack('>II',ib[16:24]))
          lm=re.search(r'<lastBuildDate>(.*?)</lastBuildDate>',rb,re.I|re.S)
          rep={'article_status':ac,'article_h1_ok':'<h1>O víkendu se uklízí celé Česko. Přidá se i Kadaň?</h1>' in ab,'article_og_ok':base+img in ab,'image_status':ic,'image_dimensions':dims,'image_sha256':hashlib.sha256(ib).hexdigest() if ib else None,'homepage_status':hc,'homepage_contains_article':slug in hb,'rss_status':rc,'rss_contains_article':slug in rb,'rss_last_build_date':lm.group(1).strip() if lm else None,'rss_head':rb[:1800],'sitemap_status':sc,'sitemap_contains_article':slug in sb}
          Path('nasekadan-live/live-probe.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rep,ensure_ascii=False))
          PY
      - name: Uložit kartu, checksumy a probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'nasekadan-bridge-assets'
          git config user.email 'info@nasekadan.cz'
          git add nasekadan-live/files/social/uklidme-kadan-world-cleanup-day-20260917.png \
                  nasekadan-live/files/social/uklidme-kadan-world-cleanup-day-20260917.png.sha256 \
                  nasekadan-live/files/clanky/uklidme-kadan-world-cleanup-day-20260917.html.sha256 \
                  nasekadan-live/live-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Naše Kadaň: OG karta, checksumy a veřejný probe Ukliďme Kadaň [skip ci]'
            git push origin HEAD:main
          fi
