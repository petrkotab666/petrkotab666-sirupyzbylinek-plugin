name: Bootstrap SirupyZBylinek Astro

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-sirupy-astro.yml'

permissions:
  contents: write

concurrency:
  group: sirupy-astro-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Astro site scaffold
        shell: bash
        run: |
          cat .github/bootstrap/sirupy-site.part* > /tmp/sirupy-site.tar.gz.b64
          echo "033313c2b7ed77096810111e562a02f83ea9394ff8b9db2dcf6fb486ae8e9abe  /tmp/sirupy-site.tar.gz.b64" | sha256sum --check
          base64 --decode /tmp/sirupy-site.tar.gz.b64 > /tmp/sirupy-site.tar.gz
          echo "ec102cefbd76c16cc915ec01c73aeccfa18df3e969c2d7bb2f8dfa2d61bad588  /tmp/sirupy-site.tar.gz" | sha256sum --check
          tar -xzf /tmp/sirupy-site.tar.gz -C .

      - name: Commit unified site scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site .github/workflows/check-sirupy-site.yml .github/workflows/import-sirupy-wordpress.yml
          if ! git diff --cached --quiet; then
            git commit -m "Připravit jednotný Astro web SirupyZBylinek"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Import complete public WordPress content
        working-directory: site
        env:
          WP_BASE_URL: https://www.sirupyzbylinek.cz/
          MAX_PAGES: 1200
          IMPORT_IMAGES: 'true'
        run: npm run import:wordpress

      - name: Verify production build
        working-directory: site
        run: npm run build

      - name: Commit migrated articles and media
        shell: bash
        run: |
          git add site/src/content/articles site/public/media/imported site/import-report.json site/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Převést obsah SirupyZBylinek z WordPressu"
            git push
          fi
