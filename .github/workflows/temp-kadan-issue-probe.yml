name: TEMP Kadaň issue runner probe
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.issue.title == 'RUN KADAN VOTES PROBE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ověřit živou publikaci a přesný reklamní slot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/kadan-votes-2023
          OUT=tmp/kadan-votes-2023/issue-probe.txt
          SLUG='alzbetinsky-klaster-95-dominikanek-kadan-1961-1999.html'
          URL="https://nasekadan.cz/clanky/$SLUG"
          {
            echo "issue_runner_started=$(date -u +%FT%TZ)"
            echo "issue=${{ github.event.issue.number }}"
            code=$(curl -4 -kLsS --max-time 25 -o /tmp/target.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL?probe=${{ github.run_id }}-$(date +%s%N)" || true)
            echo "http=$code"
            python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/target.html').read_text('utf-8',errors='replace') if Path('/tmp/target.html').exists() else ''
          for pat,name in [(r'<main\b[^>]*article-shell[^>]*>','main_tag'),(r'</section>\s*<main\b[^>]*article-shell[^>]*>','hero_to_main')]:
              m=re.search(pat,t,re.I|re.S)
              print(name+'='+(re.sub(r'\s+',' ',m.group(0)) if m else 'MISSING'))
          m=re.search(r'(.{0,500}<main\b[^>]*article-shell[^>]*>.{0,1200})',t,re.I|re.S)
          print('raw_main_excerpt='+(re.sub(r'\s+',' ',m.group(1))[:1700] if m else 'MISSING'))
          print('static_top_ad_present=' + ('YES' if 'data-nk-static-top-ad="1"' in t else 'NO'))
          print('reklamy_js_present=' + ('YES' if '/reklamy.js' in t else 'NO'))
          PY
            browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
            echo "browser=$browser"
            if [ -n "$browser" ]; then
              timeout 60s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=430,1800 --virtual-time-budget=12000 --dump-dom "$URL?render_ads=${{ github.run_id }}-$(date +%s%N)" > /tmp/rendered.html 2>/tmp/browser.err || true
              python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/rendered.html').read_text('utf-8',errors='replace') if Path('/tmp/rendered.html').exists() else ''
          print('render_static_top_ad=' + ('YES' if 'data-nk-static-top-ad="1"' in t else 'NO'))
          m=re.search(r'(.{0,300}REKLAMA.{0,1400})',t,re.I|re.S)
          print('rendered_ad_excerpt='+(re.sub(r'\s+',' ',m.group(1))[:1700] if m else 'MISSING'))
          PY
            fi
          } > "$OUT"
          cat "$OUT"
          git config user.name research-bot
          git config user.email research-bot@users.noreply.github.com
          git add "$OUT"
          git commit -m 'temp: zjistit přesný reklamní slot 5. dílu [skip ci]' || exit 0
          git push origin HEAD:main
