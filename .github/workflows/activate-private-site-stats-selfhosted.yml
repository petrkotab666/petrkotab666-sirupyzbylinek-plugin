name: Aktivovat soukromé statistiky na vlastním runneru
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: private-site-stats-selfhosted, cancel-in-progress: false}
jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Doplnit měření do pluginu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sirupyzbylinek-automatizace.php'); t=p.read_text(encoding='utf-8'); changed=False
          n=re.sub(r'(?m)^ \* Version: 1\.0\.1$', ' * Version: 1.0.2', t)
          if n!=t: t=n; changed=True
          if 'SZB_PRIVATE_STATS_V1' not in t:
              t=t.rstrip()+r'''

/* SZB_PRIVATE_STATS_V1 */
function szb_auto_private_stats_script() {
	if ( is_admin() ) { return; }
	wp_enqueue_script( 'szb-private-stats', 'https://nasekadan.cz/_nkstats/tracker.js', array(), '20260730-1', true );
	wp_script_add_data( 'szb-private-stats', 'strategy', 'defer' );
}
add_action( 'wp_enqueue_scripts', 'szb_auto_private_stats_script', 5 );

function szb_auto_private_stats_redirect() {
	$request_path = isset( $_SERVER['REQUEST_URI'] ) ? wp_parse_url( wp_unslash( $_SERVER['REQUEST_URI'] ), PHP_URL_PATH ) : '';
	if ( 'statistiky' !== trim( (string) $request_path, '/' ) ) { return; }
	wp_redirect( 'https://nasekadan.cz/statistiky-webu/?site=sirupyzbylinek.cz', 302, 'SirupyZBylinek.cz' );
	exit;
}
add_action( 'template_redirect', 'szb_auto_private_stats_redirect', 1 );
'''+"\n"; changed=True
          if changed: p.write_text(t,encoding='utf-8')
          print('Změna:',changed)
          PY
      - name: Commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sirupyzbylinek-automatizace.php && git commit -m 'Aktivovat měření návštěvnosti webu'
          git pull --rebase origin main && git push origin HEAD:main
