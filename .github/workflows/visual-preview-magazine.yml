name: Visual preview magazine

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/visual-preview-magazine.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Start static server
        run: |
          python3 -m http.server 4321 --directory site/dist >/tmp/sirupy-magazine-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4321/magazin/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sirupy-magazine-preview.log
          exit 1
      - name: Capture screenshots
        run: |
          mkdir -p visual-preview-magazine
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1200 \
            --screenshot=visual-preview-magazine/magazine-desktop.png \
            http://127.0.0.1:4321/magazin/
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=430,1100 \
            --screenshot=visual-preview-magazine/magazine-mobile.png \
            http://127.0.0.1:4321/magazin/
      - uses: actions/upload-artifact@v4
        with:
          name: magazine-articles-preview
          path: visual-preview-magazine/*.png
          if-no-files-found: error
          retention-days: 3
