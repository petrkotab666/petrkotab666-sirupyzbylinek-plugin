name: Synchronizace centrální affiliate databáze
on:
  push:
    branches: [main]
    paths: ['assets/affiliate-site-config.json','.github/workflows/sync-central-affiliate.yml']
  issues:
    types: [opened]
  schedule:
    - cron: '22 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: central-affiliate-${{ github.repository }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.event_name != 'issues' || github.event.issue.title == '[affiliate-sync] trigger'
    uses: petrkotab666/nasekadan/.github/workflows/reusable-affiliate-sync-public.yml@main
    with:
      runs_on: '["ubuntu-latest"]'
