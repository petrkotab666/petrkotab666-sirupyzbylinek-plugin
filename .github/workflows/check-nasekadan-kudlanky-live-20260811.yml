name: Ověřit živé nasazení kudlanek Naše Kadaň

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[live-check] nasekadan kudlanky'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načíst živou stránku bez cache
        id: check
        shell: bash
        run: |
          set -euo pipefail
          url='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html'
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url?livecheck=$stamp" -o /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live.html').read_text(encoding='utf-8',errors='replace')
          checks={
            'new_time':'VÝSTAVA PRODLOUŽENA DO KONCE SRPNA' in s,
            'new_title':'Zoopark Chomutov: výstava kudlanek pokračuje do konce srpna' in s,
            'new_text':'prodloužil až do konce srpna' in s,
            'old_title':'Zoopark Chomutov: poslední dny výstavy kudlanek' in s,
          }
          print(checks)
          Path('/tmp/result.txt').write_text('\n'.join(f'{k}={str(v).lower()}' for k,v in checks.items())+'\n',encoding='utf-8')
          raise SystemExit(0 if checks['new_time'] and checks['new_title'] and checks['new_text'] and not checks['old_title'] else 2)
          PY

      - name: Zapsat úspěch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'✅ LIVE_OK: Naše Kadaň veřejně vrací novou kartu Zooparku — výstava kudlanek je uvedena jako prodloužená do konce srpna.'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});

      - name: Zapsat neúspěch
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'❌ LIVE_OLD_OR_ERROR: Veřejná stránka zatím nepotvrdila novou kartu kudlanek. Kontrola běžela přímo z GitHub-hosted runneru s cache-busting URL.'});
