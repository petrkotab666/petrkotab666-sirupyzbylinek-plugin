name: Temporary CEZ TED procedure search

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  search:
    if: startsWith(github.event.issue.title, '[CEZ-PROCEDURE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install --quiet requests
      - run: python3 scripts/tmp_cez_procedure_search_20260823.py
      - name: Commit parsed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_cez_procedure_search_20260823
          git commit -m "Store temporary CEZ TED procedure search output" || exit 0
          git push origin HEAD:main
