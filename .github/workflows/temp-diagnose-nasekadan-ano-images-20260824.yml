name: TEMP Diagnose Naše Kadaň ANO images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-diagnose-nasekadan-ano-images-20260824.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live pages and images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/images
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
          python <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO

          out = Path('out')
          slug = 'ptejte-se-vyzyva-ano-kdyz-jsme-se-zeptali-my-odpoved-odmitlo'
          urls = {
              'home': 'https://nasekadan.cz/',
              'home_www': 'https://www.nasekadan.cz/',
              'archive': 'https://nasekadan.cz/clanky/',
              'article': f'https://nasekadan.cz/clanky/{slug}.html',
              'article_www': f'https://www.nasekadan.cz/clanky/{slug}.html',
          }
          uas = {
              'browser': 'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36',
              'facebook': 'facebookexternalhit/1.1 (+https://www.facebook.com/externalhit_uatext.php)',
          }
          report = {'slug': slug, 'requests': {}, 'candidates': []}
          seen = set()
          session = requests.Session()

          def image_info(name, url, ua):
              key = (url, ua)
              if key in seen:
                  return
              seen.add(key)
              try:
                  r = session.get(url, headers={'User-Agent': ua}, timeout=30, allow_redirects=True)
                  item = {'name': name, 'url': url, 'final_url': r.url, 'status': r.status_code, 'content_type': r.headers.get('content-type'), 'bytes': len(r.content)}
                  if r.ok and (r.headers.get('content-type') or '').startswith('image/'):
                      try:
                          im = Image.open(BytesIO(r.content))
                          item['width'], item['height'], item['format'] = im.width, im.height, im.format
                          safe = re.sub(r'[^A-Za-z0-9_.-]+', '_', name)[:90]
                          ext = '.png' if im.format == 'PNG' else '.jpg'
                          p = out / 'images' / f'{safe}{ext}'
                          p.write_bytes(r.content)
                          item['saved_as'] = str(p)
                      except Exception as exc:
                          item['image_error'] = repr(exc)
                  report['candidates'].append(item)
              except Exception as exc:
                  report['candidates'].append({'name': name, 'url': url, 'error': repr(exc)})

          for page_name, page_url in urls.items():
              for ua_name, ua in uas.items():
                  try:
                      r = session.get(page_url, headers={'User-Agent': ua}, timeout=30, allow_redirects=True)
                      text = r.text
                      (out / f'{page_name}_{ua_name}.html').write_text(text, encoding='utf-8')
                      soup = BeautifulSoup(text, 'html.parser')
                      og = {}
                      for tag in soup.find_all('meta'):
                          key = tag.get('property') or tag.get('name')
                          if key in {'og:image','og:image:secure_url','og:image:width','og:image:height','og:url','twitter:image'}:
                              og[key] = tag.get('content')
                      req = {
                          'requested_url': page_url,
                          'final_url': r.url,
                          'status': r.status_code,
                          'content_type': r.headers.get('content-type'),
                          'og': og,
                          'slug_present': slug in text,
                      }
                      if slug in text:
                          pos = text.find(slug)
                          snippet = text[max(0,pos-2500):pos+3500]
                          (out / f'{page_name}_{ua_name}_target_snippet.html').write_text(snippet, encoding='utf-8')
                          req['snippet_file'] = f'{page_name}_{ua_name}_target_snippet.html'
                          patterns = [
                              r'https?://[^\"\'\s)]+',
                              r'/[^\"\'\s)]+\.(?:png|jpe?g|webp)(?:\?[^\"\'\s)]*)?',
                          ]
                          for pattern in patterns:
                              for match in re.findall(pattern, snippet, re.I):
                                  if any(ext in match.lower() for ext in ('.png','.jpg','.jpeg','.webp')):
                                      image_info(f'{page_name}_{ua_name}_snippet_{len(report["candidates"])}', urljoin(r.url, match), ua)
                      for key in ('og:image','og:image:secure_url','twitter:image'):
                          if og.get(key):
                              image_info(f'{page_name}_{ua_name}_{key}', urljoin(r.url, og[key]), ua)
                      report['requests'][f'{page_name}_{ua_name}'] = req
                  except Exception as exc:
                      report['requests'][f'{page_name}_{ua_name}'] = {'requested_url': page_url, 'error': repr(exc)}

          for url in [
              'https://nasekadan.cz/social-card.png',
              'https://nasekadan.cz/social-preview.png',
              f'https://nasekadan.cz/social/{slug}-5d8df19ca6.png',
          ]:
              image_info('explicit_' + url.rsplit('/',1)[-1], url, uas['facebook'])

          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasekadan-ano-image-diagnostic
          path: out/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

# trigger 2
