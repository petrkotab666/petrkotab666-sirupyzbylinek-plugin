name: Deploy plugin to WordPress

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deployer for Git
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Repository secret DEPLOY_URL is not configured."
            exit 1
          fi

          headers_file="$(mktemp)"
          body_file="$(mktemp)"

          set +e
          http_status="$(curl \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$DEPLOY_URL")"
          curl_exit=$?
          set -e

          echo "HTTP status: $http_status"
          grep -iE '^(server|content-type|www-authenticate):' "$headers_file" || true

          if grep -qi '^content-type: *application/json' "$headers_file" && jq -e . "$body_file" >/dev/null 2>&1; then
            echo "Response code: $(jq -r '.code // "(none)"' "$body_file")"
            echo "Response message: $(jq -r '.message // "(none)"' "$body_file")"
            echo "Response data status: $(jq -r '.data.status // "(none)"' "$body_file")"
          else
            echo "Response body preview:"
            head -c 500 "$body_file" | sed -E 's#https?://[^[:space:]"<]+#[URL REDACTED]#g'
            echo
          fi

          if [ "$curl_exit" -ne 0 ]; then
            echo "The deployment request could not be completed by curl."
            exit "$curl_exit"
          fi

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "The deployment endpoint rejected the request."
            exit 22
          fi

          echo "Deployment endpoint accepted the request."
