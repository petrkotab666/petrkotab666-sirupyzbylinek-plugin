name: Naše Kadaň – finalizace oprav z lokálních payloadů 2026-09-13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nasekadan-finalize-local-payloads-20260913.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Připravit zbývající opravy bez síťového čtení článků
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re, urllib.parse
          ROOT=Path('nasekadan-live'); FILES=ROOT/'files'
          summary=json.loads((ROOT/'live-audit-summary.json').read_text(encoding='utf-8'))
          by_url={}
          for w in summary.get('warnings') or []:
              by_url.setdefault(w['url'],set()).add(w['type'])
          def clean(v): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',v or '',flags=re.S))).strip()
          def attr(tag,name):
              m=re.search(rf'\b{re.escape(name)}\s*=\s*(["\'])(.*?)\1',tag,re.I|re.S)
              return html.unescape(m.group(2)).strip() if m else None
          def meta(body,key):
              for tag in re.findall(r'<meta\b[^>]*>',body,re.I|re.S):
                  if (attr(tag,'property') or attr(tag,'name') or '').lower()==key.lower(): return attr(tag,'content')
              return None
          def schema(body,url):
              h1=re.search(r'<h1\b[^>]*>(.*?)</h1>',body,re.I|re.S)
              data={'@context':'https://schema.org','@type':'NewsArticle','headline':clean(h1.group(1) if h1 else ''),'description':meta(body,'description') or meta(body,'og:description') or '', 'datePublished':meta(body,'article:published_time') or '2026-08-14T10:44:00+02:00','dateModified':meta(body,'article:modified_time') or meta(body,'article:published_time') or '2026-08-14T20:51:00+02:00','author':{'@type':'Organization','name':'Naše Kadaň','url':'https://nasekadan.cz/o-webu/'},'publisher':{'@type':'Organization','name':'Naše Kadaň','url':'https://nasekadan.cz/'},'mainEntityOfPage':{'@type':'WebPage','@id':url},'image':[meta(body,'og:image') or 'https://nasekadan.cz/social-card.png'],'inLanguage':'cs-CZ','isAccessibleForFree':True}
              return '<script type="application/ld+json">'+json.dumps(data,ensure_ascii=False,separators=(',',':'))+'</script>'
          payload=[]; changed=[]
          for url,types in sorted(by_url.items()):
              rel=urllib.parse.urlsplit(url).path.lstrip('/')
              if not rel.startswith('clanky/') or not rel.endswith('.html'): continue
              p=FILES/rel
              if not p.is_file(): raise SystemExit(f'Chybí připravený payload {rel}')
              body=p.read_text(encoding='utf-8'); original=body
              if 'nonstandard_header' in types and 'data-site-header="v1"' not in body:
                  body=re.sub(r'<header\b(?![^>]*data-site-header=)', '<header data-site-header="v1"',body,count=1,flags=re.I)
              if 'nonstandard_footer' in types and 'data-site-footer="v1"' not in body:
                  body=re.sub(r'<footer\b(?![^>]*data-site-footer=)', '<footer data-site-footer="v1"',body,count=1,flags=re.I)
              if 'missing_newsarticle_schema' in types and 'NewsArticle' not in body:
                  body=body.replace('</head>',schema(body,url)+'\n</head>',1)
              if url.endswith('/ohre-kadan-hydrologicke-sucho-srpen-2026.html') and 'data-nk-title-figure="1"' not in body:
                  fig='\n<figure class="article-figure" data-nk-title-figure="1"><img class="article-photo" src="https://nasekadan.cz/social-card.png" width="1200" height="630" alt="Ohře v Kadani pod hranicí hydrologického sucha – Naše Kadaň" fetchpriority="high" decoding="async"><figcaption>Redakční grafika Naše Kadaň.</figcaption></figure>\n'
                  article=re.search(r'<article\b[^>]*class=["\'][^"\']*\barticle\b[^"\']*["\'][^>]*>',body,re.I) or re.search(r'<article\b[^>]*>',body,re.I)
                  tail=body[article.end():]
                  lead=re.search(r'<p\b[^>]*class=["\'][^"\']*\b(?:lead|leadtext)\b[^"\']*["\'][^>]*>.*?</p>',tail,re.I|re.S)
                  h1=re.search(r'<h1\b[^>]*>.*?</h1>',tail,re.I|re.S)
                  at=article.end()+(lead.end() if lead else (h1.end() if h1 else 0)); body=body[:at]+fig+body[at:]
              if body!=original:
                  p.write_text(body,encoding='utf-8'); changed.append(rel)
              blob=p.read_bytes(); payload.append({'path':rel,'sha256':hashlib.sha256(blob).hexdigest()})
          audit=ROOT/'audit_live_site.py'; t=audit.read_text(encoding='utf-8')
          t=t.replace('''        if src:\n            u = norm(src, page_url)\n            if internal(u):\n                out.append(u)''','''        if src and not src.lower().startswith("data:"):\n            u = norm(src, page_url)\n            if internal(u):\n                out.append(u)''',1)
          t=t.replace('''        is_title = (\n            urllib.parse.urlsplit(srcn).path.startswith("/social/")\n            and (\n                (width == "1200" and height == "630")\n                or "redakční grafika" in low\n                or "titulní grafika" in low\n                or "data-nk-title-figure" in low\n                or "article-photo" in low\n            )\n        )''','''        is_title = (\n            (width == "1200" and height == "630")\n            or "redakční grafika" in low\n            or "titulní grafika" in low\n            or "data-nk-title-figure" in low\n            or "article-photo" in low\n        )''',1)
          audit.write_text(t,encoding='utf-8')
          if len(payload)>100: raise SystemExit(f'Příliš mnoho payloadů: {len(payload)}')
          (ROOT/'manifest.json').write_text(json.dumps({'schema':1,'version':'20260913-final-audit-repair-v2','files':payload,'patches':[],'deletes':[]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (ROOT/'final-audit-repair-summary.json').write_text(json.dumps({'changed_pages':len(changed),'manifest_files':len(payload),'changed':changed},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CHANGED',len(changed),'MANIFEST_FILES',len(payload))
          PY
      - name: Commitnout a ověřit veřejné převzetí
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile nasekadan-live/audit_live_site.py
          git config user.name 'Naše Kadaň bridge bot'
          git config user.email 'info@nasekadan.cz'
          git add nasekadan-live/audit_live_site.py nasekadan-live/manifest.json nasekadan-live/files/clanky nasekadan-live/final-audit-repair-summary.json
          git commit -m 'Dokončit opravy nalezené úplným auditem [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          for attempt in $(seq 1 36); do
            sleep 5
            h="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/deployment-health.txt?finalv2=$attempt-$(date +%s)" || true)"
            printf '%s\n' "$h"
            grep -Fq 'source=bridge:20260913-final-audit-repair-v2' <<<"$h" && { echo FINAL_V2_PUBLIC_OK; exit 0; }
          done
          exit 1
