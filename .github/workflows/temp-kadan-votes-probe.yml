name: TEMP Kadaň vote runner probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-kadan-votes-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit runner marker
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/kadan-votes-2023
          printf 'runner_started=%s\ncommit=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > tmp/kadan-votes-2023/probe.txt
          git config user.name research-bot
          git config user.email research-bot@users.noreply.github.com
          git add tmp/kadan-votes-2023/probe.txt
          git commit -m 'temp: runner probe marker [skip ci]'
          git push origin HEAD:main
