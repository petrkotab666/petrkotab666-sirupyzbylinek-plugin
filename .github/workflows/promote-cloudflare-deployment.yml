name: Verify Cloudflare Pages production

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/promote-cloudflare-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'force-cloudflare-production-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 87659411eeb4335b3c1e2c01014edbfb
      CLOUDFLARE_PROJECT_NAME: sirupyzbylinek-astro

    steps:
      - name: Confirm canonical production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"

          printf '%s' "$PROJECT" | jq -r '"Canonical deployment: \(.result.canonical_deployment.id)\nEnvironment: \(.result.canonical_deployment.environment)\nURL: \(.result.canonical_deployment.url)\nCommit: \(.result.canonical_deployment.deployment_trigger.metadata.commit_hash)"'
          printf '%s' "$PROJECT" | jq -e '.success == true and .result.canonical_deployment.environment == "production" and .result.canonical_deployment.latest_stage.status == "success"' >/dev/null

      - name: Verify main pages.dev address without cache
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            CACHE_BUSTER="$(date +%s)-${attempt}"
            VERSION_FILE="$(mktemp)"
            ARTICLE_FILE="$(mktemp)"
            VERSION_HEADERS="$(mktemp)"
            ARTICLE_HEADERS="$(mktemp)"

            curl --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --dump-header "$VERSION_HEADERS" \
              --output "$VERSION_FILE" \
              "https://sirupyzbylinek-astro.pages.dev/deploy-version.txt?v=${CACHE_BUSTER}" || true

            curl --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --dump-header "$ARTICLE_HEADERS" \
              --output "$ARTICLE_FILE" \
              "https://sirupyzbylinek-astro.pages.dev/nejcastejsi-chyby-pri-pestovani-bylinek/?v=${CACHE_BUSTER}" || true

            if grep -q 'expected-cultivation-category: Pěstování bylinek' "$VERSION_FILE" \
              && grep -q 'Pěstování bylinek' "$ARTICLE_FILE" \
              && grep -q '/obrazky/pestovani.svg' "$ARTICLE_FILE" \
              && ! grep -Eiq 'Rychlé shrnutí článku|hlavní klíčové slovo|SEO 90\+|produktový XML feed|affiliate doporučení' "$ARTICLE_FILE"; then
              echo "Main pages.dev address serves the verified production deployment."
              echo 'VERSION RESPONSE HEADERS'
              cat "$VERSION_HEADERS"
              exit 0
            fi

            echo "Main address verification failed on attempt $attempt/12."
            echo 'VERSION RESPONSE HEADERS'
            cat "$VERSION_HEADERS" || true
            echo 'VERSION BODY'
            head -c 500 "$VERSION_FILE" || true
            echo
            echo 'ARTICLE RESPONSE HEADERS'
            cat "$ARTICLE_HEADERS" || true
            echo 'ARTICLE MATCHES'
            grep -Eio 'Pěstování bylinek|Bylinky a zvířata|Rychlé shrnutí článku|produktový XML feed' "$ARTICLE_FILE" | head -n 20 || true
            sleep 10
          done

          echo "The Cloudflare API has the new canonical deployment, but the public subdomain still serves different content."
          exit 1
