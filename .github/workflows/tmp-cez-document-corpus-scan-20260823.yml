name: Temporary CEZ full document-corpus scan

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  scan:
    if: startsWith(github.event.issue.title, '[CEZ-CORPUS]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Scan every downloaded and archived procurement document
        shell: bash
        run: |
          set +e
          mkdir -p tmp_cez_document_corpus_scan_20260823
          python3 scripts/tmp_cez_document_corpus_scan_20260823.py > tmp_cez_document_corpus_scan_20260823/RUN.log 2>&1
          echo "$?" > tmp_cez_document_corpus_scan_20260823/EXIT_CODE.txt
          cat tmp_cez_document_corpus_scan_20260823/RUN.log
          exit 0
      - name: Commit reports and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_cez_document_corpus_scan_20260823
          git commit -m "Store temporary CEZ full document-corpus scan" || exit 0
          git push origin HEAD:main
