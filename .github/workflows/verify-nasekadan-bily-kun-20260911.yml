name: Verify Nase Kadan bily kun 20260911
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-nasekadan-bily-kun-20260911.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public article listings and image
        shell: bash
        run: |
          set -Eeuo pipefail
          slug='bily-kun-245-tisic-kadan-policie-2026.html'
          image='bily-kun-245-tisic-kadan-policie-2026-e5e04d5896.png'
          for i in $(seq 1 12); do
            q="${GITHUB_RUN_ID}-${i}-$(date +%s)"
            article="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/$slug?verify=$q" || true)"
            home="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/?verify=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 20 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/?verify=$q" || true)"
            code="$(curl -4 -kLsS --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/card.png -w '%{http_code}' "https://nasekadan.cz/social/$image?verify=$q" || true)"
            title_ok=0
            home_ok=0
            archive_ok=0
            grep -Fq 'Za 2 450 korun nechal přes svůj účet protéct 245 tisíc' <<<"$article" && title_ok=1 || true
            grep -Fq "$slug" <<<"$home" && home_ok=1 || true
            grep -Fq "$slug" <<<"$archive" && archive_ok=1 || true
            echo "attempt=$i title_ok=$title_ok home_ok=$home_ok archive_ok=$archive_ok image_http=$code"
            if [ "$title_ok" = 1 ] && [ "$home_ok" = 1 ] && [ "$archive_ok" = 1 ] && [ "$code" = 200 ]; then
              echo 'NASEKADAN_PUBLIC_PUBLISH_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'NASEKADAN_PUBLIC_PUBLISH_NOT_OK' >&2
          exit 1
