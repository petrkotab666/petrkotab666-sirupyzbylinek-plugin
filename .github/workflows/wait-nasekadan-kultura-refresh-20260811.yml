name: Čekat na obnovu kulturního přehledu Naše Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wait-nasekadan-kultura-refresh-20260811.yml'

permissions:
  contents: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Čekat na Cafe Lingua a box
        shell: bash
        run: |
          set -euo pipefail
          url='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-10-16-srpna-2026.html'
          mkdir -p reports
          ok=0
          for i in $(seq 1 42); do
            stamp="${GITHUB_RUN_ID}-$i-$(date +%s)"
            curl -4 -kfsSL --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url?refresh=$stamp" -o /tmp/kultura.html || true
            cafe=no; boxing=no
            grep -Fq 'Cafe Lingua Poland v RADCE' /tmp/kultura.html 2>/dev/null && cafe=yes
            grep -Fq 'Zpátky do školy – v kondici: trénink boxu pro děti a rodiče' /tmp/kultura.html 2>/dev/null && boxing=yes
            printf '%s attempt=%s cafe=%s boxing=%s\n' "$(date -u +%FT%TZ)" "$i" "$cafe" "$boxing" | tee reports/nasekadan-kultura-refresh.txt
            if [ "$cafe" = yes ] && [ "$boxing" = yes ]; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1
      - name: Uložit potvrzení
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nasekadan-kultura-refresh.txt
          git commit -m 'Potvrdit živý kulturní přehled Naše Kadaň [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
