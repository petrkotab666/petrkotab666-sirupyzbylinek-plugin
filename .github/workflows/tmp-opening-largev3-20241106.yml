name: tmp-opening-largev3-20241106
on:
  push:
    branches: [tmp-attendance-view-20241106]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and enhance opening audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet faster-whisper
          mkdir -p out
          HLS='https://tv.pirati.cz/static/streaming-playlists/hls/09f34430-d077-4c19-b932-41005e402f19/4596793a-66a9-4cf5-b40e-0bb973996508-master.m3u8'
          ffmpeg -hide_banner -loglevel error -ss 0 -t 150 -i "$HLS" -vn -ac 1 -ar 16000 out/raw.wav
          ffmpeg -hide_banner -loglevel error -i out/raw.wav -af 'highpass=f=80,lowpass=f=7800,afftdn=nf=-25,dynaudnorm=f=250:g=25,loudnorm=I=-16:TP=-1.5:LRA=11' out/enhanced.wav
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          import os
          names='''Tomáš Oršulák, Stanislav Hakl, Petr Hossner, Alena Benešová, Jiří Kulhánek, Jan Losenický, Radek Oswald, Jiří Jerie, Adam Studený, Josef Steiner, Jan Vaic, Michal Voltr, Aleš Padrta, Zdeněk Hosman, Martina Matoušková Faldusová, Pavel Neprášek, Stanislava Pardubská, Miloš Wendl, Pavel Zárybnický, Jana Demjanová, Jan Lazarčík, Miroslav Novotný, Miloslav Straka, Jiří Švec, Jindra Zalabáková, Radek Jára, Jan Zach'''
          prompt='Mimořádné zasedání Zastupitelstva města Kadaně 6. listopadu 2024. Přítomno 26 zastupitelů, jeden omluven. Možná jména: '+names+'. Přepiš přesně, nevymýšlej.'
          for audio in ['out/raw.wav','out/enhanced.wav']:
            for modelname in ['large-v3','distil-large-v3']:
              model=WhisperModel(modelname, device='cpu', compute_type='int8')
              segs,info=model.transcribe(audio, language='cs', beam_size=10, vad_filter=False, condition_on_previous_text=False, initial_prompt=prompt, temperature=0.0, no_speech_threshold=0.95, log_prob_threshold=-2.0, compression_ratio_threshold=3.0, word_timestamps=True)
              path=f"out/{os.path.basename(audio)}.{modelname}.txt"
              with open(path,'w',encoding='utf-8') as f:
                for s in segs:
                  line=f'[{s.start:06.2f}-{s.end:06.2f}] {s.text.strip()}'
                  print(audio, modelname, line)
                  f.write(line+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opening-largev3-20241106
          path: out/*.txt
          retention-days: 1
