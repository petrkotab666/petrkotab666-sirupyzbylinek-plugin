<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Velká kadaňská hra v4.1</title></head><body style="margin:0;background:#020406;color:white"><script>(async()=>{try{const parts=await Promise.all(Array.from({length:8},(_,k)=>k+1).map(i=>fetch(`game-${i}.txt?v=41`).then(r=>{if(!r.ok)throw Error(`část ${i}: ${r.status}`);return r.text()})));const b=atob(parts.join('').trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML=`<pre style="padding:20px;color:#fff">Náhled se nepodařilo spustit: ${e}</pre>`}})()</script></body></html>
